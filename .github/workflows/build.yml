name: Build

# Build and test on every push and pull request so the main branch always
# compiles. Release packaging lives in release.yml and runs only on tags.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # windows-latest ships CMake and the MSVC toolchain, so no setup step is
      # needed. Configure out-of-source into build/, matching the local layout.
      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      # Keep the built binaries from the default branch available for download
      # off the run summary, without cutting a release.
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: bin2iso-windows-x64
          path: |
            build/Release/bin2iso.exe
            build/Release/bin2iso_gui.exe
          if-no-files-found: error
